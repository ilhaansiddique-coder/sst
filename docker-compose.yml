services:
  postgres:
    image: postgres:16-alpine
    container_name: sst-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracking
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: psql042026
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres-init.sql:/docker-entrypoint-initdb.d/01-postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sst-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "tracking_redis_password", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tracking_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: sst-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./db/clickhouse-init.sql:/docker-entrypoint-initdb.d/01-clickhouse-init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  sgtm-tagging:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    container_name: sst-sgtm-tagging
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONTAINER_CONFIG: "aWQ9R1RNLVA1VFZUSE41JmVudj0xJmF1dGg9cF81aGN0NjZEQTZQelAxRTFPbWJ2QQ=="
      PORT: "8080"
      PREVIEW_SERVER_URL: "http://sst-sgtm-preview:8080"
    depends_on:
      sgtm-preview:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

  sgtm-preview:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    container_name: sst-sgtm-preview
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      CONTAINER_CONFIG: "aWQ9R1RNLVA1VFZUSE41JmVudj0xJmF1dGg9cF81aGN0NjZEQTZQelAxRTFPbWJ2QQ=="
      RUN_AS_PREVIEW_SERVER: "true"
      PORT: "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
